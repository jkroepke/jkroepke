name: Update Profile
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

permissions: {}

jobs:
  markscribe:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: 'false'

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 'stable'

      - name: Prepare Go module
        run: go mod tidy

      - name: Validate markscribe
        if: github.event_name == 'pull_request'
        run: go tool markscribe -h

      - name: Generate README
        if: github.event_name != 'pull_request'
        run: go tool markscribe -write README.md templates/README.md.tpl
        env:
          GITHUB_TOKEN: ${{ secrets.PERSONAL_GITHUB_TOKEN }}

      - name: Generate stats card
        if: github.event_name != 'pull_request'
        uses: readme-tools/github-readme-stats-action@f9d8133845f40d659a754f78b8484983ba766448 # v2.0.1
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&count_private=false&theme=tokyonight
          path: profile/stats.svg
          token: ${{ secrets.PERSONAL_GITHUB_TOKEN }}

      - name: Commit changes
        if: github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.PERSONAL_GITHUB_TOKEN }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        #language=bash
        run: |
          set -euo pipefail

          DELETED_FILES=$(git diff --diff-filter=D --name-only HEAD)
          MODIFIED_FILES=$(git diff --diff-filter=ACM --name-only HEAD)

          if [ -z "$DELETED_FILES" ] && [ -z "$MODIFIED_FILES" ]; then
            echo "No files added, modified, or deleted. Skipping."
            exit 0
          fi

          FILE_CHANGES_JSON_FILE=$(mktemp)
          JSON_PAYLOAD_FILE=$(mktemp)
          RESPONSE_FILE=$(mktemp)
          trap 'rm -f "$FILE_CHANGES_JSON_FILE" "$JSON_PAYLOAD_FILE" "$RESPONSE_FILE"' EXIT

          echo '{ "deletions": [], "additions": [] }' > "$FILE_CHANGES_JSON_FILE"

          for file in $DELETED_FILES; do
            jq --arg path "$file" '.deletions += [{"path": $path}]' "$FILE_CHANGES_JSON_FILE" > "$FILE_CHANGES_JSON_FILE.tmp"
            mv "$FILE_CHANGES_JSON_FILE.tmp" "$FILE_CHANGES_JSON_FILE"
          done

          for file in $MODIFIED_FILES; do
            TMP_CONTENT_FILE=$(mktemp)
            base64 -w 0 <"$file" > "$TMP_CONTENT_FILE"

            jq --arg path "$file" --rawfile content "$TMP_CONTENT_FILE" \
              '.additions += [{"path": $path, "contents": $content}]' "$FILE_CHANGES_JSON_FILE" > "$FILE_CHANGES_JSON_FILE.tmp"

            mv "$FILE_CHANGES_JSON_FILE.tmp" "$FILE_CHANGES_JSON_FILE"
            rm "$TMP_CONTENT_FILE"
          done

          jq -n --arg repo "$GITHUB_REPOSITORY" \
                --arg branch "$GITHUB_REF_NAME" \
                --arg message "Update profile [skip ci]" \
                --arg expectedOid "$GITHUB_SHA" \
                --slurpfile fileChanges "$FILE_CHANGES_JSON_FILE" \
                '{
                  query: "mutation ($input: CreateCommitOnBranchInput!) {
                    createCommitOnBranch(input: $input) {
                      commit {
                        url
                      }
                    }
                  }",
                  variables: {
                    input: {
                      branch: {
                        repositoryNameWithOwner: $repo,
                        branchName: $branch
                      },
                      message: { headline: $message },
                      fileChanges: $fileChanges[0],
                      expectedHeadOid: $expectedOid
                    }
                  }
                }' > "$JSON_PAYLOAD_FILE"

          curl https://api.github.com/graphql \
            --fail-with-body \
            --silent \
            --show-error \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            --data "@$JSON_PAYLOAD_FILE" \
            > "$RESPONSE_FILE"

          jq -e 'if .errors then error(.errors | tostring) else .data.createCommitOnBranch.commit.url end' "$RESPONSE_FILE"
